# Автосборка APK для Android на каждый push.
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   UNITY_EMAIL, UNITY_PASSWORD — вход в Unity-аккаунт;
#   UNITY_LICENSE — содержимое файла лицензии .ulf (для Personal — см. README, раздел «Сборка APK»).
# Готовый APK: вкладка Actions → последний запуск → Artifacts → TrainManager-apk.
name: Android APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: false

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: TrainManager.EditorTools.CIBuild.BuildAndroid
          androidExportType: androidPackage

      - uses: actions/upload-artifact@v4
        with:
          name: TrainManager-apk
          path: Build/Android/TrainManager.apk
          retention-days: 14
